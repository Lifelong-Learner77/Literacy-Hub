<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Scaffold Tool</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f5f2;color:#111;padding:24px 16px 60px}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .subtitle{font-size:13px;color:#666;margin-bottom:20px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .ctrl-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
  .ctrl-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em}
  select{width:100%;padding:8px 10px;font-size:14px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#111;cursor:pointer}
  .wb-panel{background:#f0efe9;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:18px}
  .wb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
  .wb-title{font-size:13px;font-weight:600}
  .wb-hint{font-size:11px;color:#888}
  .wb-words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .wb-word{display:inline-block;background:#fff;border:1px solid #ccc;border-radius:6px;font-size:13px;color:#111;padding:4px 10px;cursor:pointer;user-select:none}
  .wb-word:hover{background:#e8f0fe;color:#1a56c4;border-color:#a0b8e8}
  .wb-add-row{display:flex;gap:6px}
  .wb-add-row input{flex:1;padding:6px 10px;font-size:13px;border-radius:6px;border:1px solid #ccc;background:#fff}
  .wb-add-row button{padding:6px 14px;font-size:13px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
  .wb-add-row button:hover{background:#f0efe9}
  .scaffold-wrap{display:flex;flex-direction:column;gap:12px}
  .sbox{border-radius:10px;border:1px solid #ddd;overflow:hidden;background:#fff}
  .sbox-head{padding:10px 14px;display:flex;align-items:center;gap:10px}
  .sbox-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
  .sbox-name{font-size:14px;font-weight:600}
  .sbox-hint{font-size:12px;margin-top:2px}
  .sbox-body{padding:12px 14px 16px;border-top:1px solid #eee;background:#fff}
  .starter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .starter{display:inline-block;background:#f5f5f2;border:1px solid #ddd;border-radius:6px;font-size:12px;color:#555;padding:3px 9px;font-style:italic;cursor:pointer}
  .starter:hover{background:#fff;border-color:#aaa;color:#333}
  textarea{width:100%;border:none;border-bottom:1.5px solid #ccc;background:transparent;font-size:15px;color:#111;padding:6px 2px;resize:none;outline:none;line-height:1.7;font-family:Arial,sans-serif}
  textarea:focus{border-bottom-color:#555}
  .sub-label{font-size:12px;color:#666;margin:12px 0 6px;font-weight:600}
  .student-info{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .info-field{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px}
  .info-field label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em}
  .info-field input{border:none;border-bottom:1.5px solid #ccc;font-size:14px;padding:4px 2px;outline:none;background:transparent;font-family:Arial,sans-serif}
  .info-field input:focus{border-bottom-color:#555}
  .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .foot button{flex:1;min-width:140px;padding:10px 16px;font-size:14px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#111;cursor:pointer;font-family:Arial,sans-serif}
  .foot button:hover{background:#f0efe9}
  .btn-print{background:#1a56c4 !important;color:#fff !important;border-color:#1a56c4 !important}
  .btn-print:hover{background:#1446a8 !important}
  .btn-export{background:#188038 !important;color:#fff !important;border-color:#188038 !important}
  .btn-export:hover{background:#146830 !important}

  @media print {
    body{background:#fff;padding:20px}
    .controls,.foot,.wb-add-row,.wb-hint,.starter,.print-hide{display:none !important}
    .wb-panel{background:#f9f9f7;border:1px solid #ddd;page-break-inside:avoid}
    .wb-top{margin-bottom:4px}
    .wb-words{margin-bottom:0}
    .wb-word{pointer-events:none;font-size:12px;padding:3px 8px}
    .sbox{page-break-inside:avoid;margin-bottom:14px;border:1px solid #ccc}
    textarea{min-height:44px;border-bottom:1px solid #aaa}
    h1{font-size:18px}
  }
</style>
</head>
<body>

<h1>Writing Scaffold Tool</h1>
<p class="subtitle">Select a grade level and paragraph type, then fill in the boxes to plan your writing.</p>

<div class="student-info print-hide" style="display:none" id="student-info-row">
  <div class="info-field"><label>Student name</label><input type="text" placeholder="First Last" id="s-name"/></div>
  <div class="info-field"><label>Date</label><input type="text" placeholder="MM/DD/YYYY" id="s-date"/></div>
  <div class="info-field"><label>Class / period</label><input type="text" placeholder="e.g. Period 3" id="s-class"/></div>
</div>

<div id="student-info-print" style="display:none;margin-bottom:18px">
  <p style="font-size:14px"><strong>Name:</strong> <span id="p-name"></span> &nbsp;&nbsp; <strong>Date:</strong> <span id="p-date"></span> &nbsp;&nbsp; <strong>Class:</strong> <span id="p-class"></span></p>
</div>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Grade level</span>
    <select id="grade" onchange="render()">
      <option value="elem">Elementary (K–5)</option>
      <option value="mid">Middle school (6–8)</option>
      <option value="high">High school (9–12)</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Paragraph type</span>
    <select id="ptype" onchange="render()">
      <option value="opinion">Opinion</option>
      <option value="informational">Informational / expository</option>
      <option value="narrative">Narrative</option>
      <option value="compare">Compare and contrast</option>
      <option value="problem">Problem and solution</option>
    </select>
  </div>
  <div class="ctrl-group" style="justify-content:flex-end;flex-direction:row;align-items:flex-end">
    <label style="font-size:12px;color:#666;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="show-info" onchange="toggleInfo()"> Show student info fields
    </label>
  </div>
</div>

<div class="wb-panel">
  <div class="wb-top">
    <span class="wb-title">Word bank</span>
    <span class="wb-hint print-hide">Click a word to insert it into your last typed box</span>
  </div>
  <div class="wb-words" id="wb-words"></div>
  <div class="wb-add-row print-hide">
    <input id="wb-input" type="text" placeholder="Add your own word..." maxlength="40" onkeydown="if(event.key==='Enter')addWord()"/>
    <button onclick="addWord()">Add</button>
    <button onclick="resetWords()">Reset</button>
  </div>
</div>

<div id="scaffold-out" class="scaffold-wrap"></div>

<div class="foot print-hide">
  <button class="btn-print" onclick="printScaffold()">Print / save as PDF</button>
  <button onclick="clearAll()">Clear all</button>
  <button class="btn-export" onclick="exportDoc()">Export for Google Docs</button>
</div>

let lastFocused=null;
let currentWords=[];

function toggleInfo(){
  const show=document.getElementById('show-info').checked;
  document.getElementById('student-info-row').style.display=show?'flex':'none';
}

function render(){
  const grade=document.getElementById('grade').value;
  const ptype=document.getElementById('ptype').value;
  currentWords=[...WORDBANKS[ptype][grade]];
  renderWordBank();
  const cfg=DATA[ptype][grade];
  const c=cfg.color;
  let html='';
  cfg.boxes.forEach(b=>{
    html+=`<div class="sbox">
      <div class="sbox-head" style="background:${c.bg};border-bottom:1px solid ${c.border}">
        <div class="sbox-num" style="background:${c.numBg};color:${c.numText}">${b.num}</div>
        <div>
          <div class="sbox-name" style="color:${c.label}">${b.name}</div>
          <div class="sbox-hint" style="color:${c.hint}">${b.hint}</div>
        </div>
      </div>
      <div class="sbox-body">
        <div class="starter-row print-hide">${b.starters.map(s=>`<span class="starter" onclick="fillNearest(this,'${s.replace(/'/g,"\\'")}')">${s}</span>`).join('')}</div>
        <div class="print-starters" style="display:none;font-size:12px;color:#777;font-style:italic;margin-bottom:6px">${b.starters.join(' &nbsp;/&nbsp; ')}</div>
        <textarea rows="${b.rows}" placeholder="Write here..." onfocus="lastFocused=this" aria-label="${b.name}"></textarea>
        ${(b.sub||[]).map(s=>`
          <div class="sub-label">${s.label}</div>
          <div class="starter-row print-hide">${s.starters.map(st=>`<span class="starter" onclick="fillNearest(this,'${st.replace(/'/g,"\\'")}')">  ${st}</span>`).join('')}</div>
          <div class="print-starters" style="display:none;font-size:12px;color:#777;font-style:italic;margin-bottom:6px">${s.starters.join(' &nbsp;/&nbsp; ')}</div>
          <textarea rows="${s.rows}" placeholder="Write here..." onfocus="lastFocused=this" aria-label="${s.label}"></textarea>
        `).join('')}
      </div>
    </div>`;
  });
  document.getElementById('scaffold-out').innerHTML=html;
  lastFocused=null;
}

function renderWordBank(){
  const container=document.getElementById('wb-words');
  container.innerHTML=currentWords.map((w,i)=>
    `<span class="wb-word" onclick="insertWord(this,'${w.replace(/'/g,"\\'")}')">  ${w}</span>`
  ).join('');
}

function insertWord(el,word){
  if(lastFocused){
    const ta=lastFocused;
    const start=ta.selectionStart,end=ta.selectionEnd;
    const val=ta.value;
    const insert=(start>0&&val[start-1]!==' '?' ':'')+word+' ';
    ta.value=val.slice(0,start)+insert+val.slice(end);
    ta.focus();
    ta.selectionStart=ta.selectionEnd=start+insert.length;
    el.style.background='#d4edda';
    setTimeout(()=>el.style.background='',800);
  } else {
    try{navigator.clipboard.writeText(word);}catch(e){}
    el.style.background='#e8f0fe';
    setTimeout(()=>el.style.background='',800);
  }
}

function addWord(){
  const inp=document.getElementById('wb-input');
  const w=inp.value.trim();
  if(!w)return;
  currentWords.push(w);
  renderWordBank();
  inp.value='';
}

function resetWords(){
  const grade=document.getElementById('grade').value;
  const ptype=document.getElementById('ptype').value;
  currentWords=[...WORDBANKS[ptype][grade]];
  renderWordBank();
}

function fillNearest(el,text){
  const body=el.closest('.sbox-body');
  const starters=el.closest('.starter-row');
  let node=starters.nextElementSibling;
  while(node){
    if(node.tagName==='TEXTAREA'){
      if(!node.value){node.value=text+' ';node.focus();node.selectionStart=node.selectionEnd=node.value.length;}
      return;
    }
    node=node.nextElementSibling;
  }
}

function clearAll(){
  document.querySelectorAll('textarea').forEach(t=>t.value='');
  renderWordBank();
}

function printScaffold(){
  document.querySelectorAll('.print-starters').forEach(el=>el.style.display='block');
  document.querySelectorAll('.print-hide').forEach(el=>el.style.display='none');
  const name=document.getElementById('s-name')?.value||'';
  const date=document.getElementById('s-date')?.value||'';
  const cls=document.getElementById('s-class')?.value||'';
  const infoRow=document.getElementById('student-info-print');
  if(name||date||cls){
    document.getElementById('p-name').textContent=name;
    document.getElementById('p-date').textContent=date;
    document.getElementById('p-class').textContent=cls;
    infoRow.style.display='block';
  }
  window.print();
  setTimeout(()=>{
    document.querySelectorAll('.print-starters').forEach(el=>el.style.display='none');
    document.querySelectorAll('.print-hide').forEach(el=>el.style.display='');
    infoRow.style.display='none';
    document.querySelectorAll('select').forEach(s=>{
      const opt=s.options[s.selectedIndex];
      if(opt)opt.selected=true;
    });
  },1000);
}

function exportDoc(){
  const grade=document.getElementById('grade').value;
  const ptype=document.getElementById('ptype').value;
  const cfg=DATA[ptype][grade];
  const name=document.getElementById('s-name')?.value||'';
  const date=document.getElementById('s-date')?.value||'';
  const cls=document.getElementById('s-class')?.value||'';
  const textareas=document.querySelectorAll('textarea');
  let taIdx=0;

  let body=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;color:#111;font-size:15px;line-height:1.6}
    h1{font-size:20px;margin-bottom:4px}
    .meta{font-size:13px;color:#666;margin-bottom:6px}
    .info-bar{font-size:13px;margin-bottom:16px;padding:8px 12px;background:#f5f5f2;border-radius:6px}
    .wb{background:#f5f5f2;padding:10px 14px;border-radius:6px;margin-bottom:20px;font-size:13px}
    .wb strong{display:block;margin-bottom:6px}
    .wb-word{display:inline-block;border:1px solid #ccc;border-radius:4px;padding:2px 8px;margin:2px;font-size:12px;background:#fff}
    hr{border:none;border-top:1px solid #ddd;margin:20px 0}
    .box{margin-bottom:22px;border-left:4px solid #ccc;padding-left:16px;page-break-inside:avoid}
    .box-name{font-weight:bold;font-size:15px;margin-bottom:2px}
    .box-hint{font-size:12px;color:#666;margin-bottom:6px}
    .box-starters{font-size:12px;color:#888;font-style:italic;margin-bottom:8px}
    .write-area{min-height:50px;border-bottom:1px solid #aaa;padding:6px 4px;font-size:15px;color:#111;margin-bottom:2px}
    .sub-label{font-size:12px;font-weight:bold;color:#555;margin:12px 0 4px}
  </style></head><body>`;

  body+=`<h1>${cfg.title}</h1>`;
  body+=`<p class="meta">${cfg.grade}</p>`;

  if(name||date||cls){
    body+=`<div class="info-bar">`;
    if(name) body+=`<strong>Name:</strong> ${name}&nbsp;&nbsp;&nbsp;`;
    if(date) body+=`<strong>Date:</strong> ${date}&nbsp;&nbsp;&nbsp;`;
    if(cls) body+=`<strong>Class / period:</strong> ${cls}`;
    body+=`</div>`;
  }

  body+=`<div class="wb"><strong>Word bank</strong><div>${currentWords.map(w=>`<span class="wb-word">${w}</span>`).join('')}</div></div>`;
  body+=`<hr>`;

  cfg.boxes.forEach(b=>{
    const val=(textareas[taIdx]?textareas[taIdx].value:'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    taIdx++;
    body+=`<div class="box">`;
    body+=`<div class="box-name">${b.num}. ${b.name}</div>`;
    body+=`<div class="box-hint">${b.hint}</div>`;
    body+=`<div class="box-starters">Sentence starters: ${b.starters.join(' / ')}</div>`;
    body+=`<div class="write-area">${val||'&nbsp;'}</div>`;
    (b.sub||[]).forEach(s=>{
      const sv=(textareas[taIdx]?textareas[taIdx].value:'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      taIdx++;
      body+=`<div class="sub-label">${s.label}</div>`;
      body+=`<div class="box-starters">Starters: ${s.starters.join(' / ')}</div>`;
      body+=`<div class="write-area">${sv||'&nbsp;'}</div>`;
    });
    body+=`</div>`;
  });

  body+=`</body></html>`;

  const blob=new Blob([body],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const ptypeLabel=document.getElementById('ptype').options[document.getElementById('ptype').selectedIndex].text.split('/')[0].trim().toLowerCase().replace(/\s+/g,'-');
  a.download=`writing-scaffold-${ptypeLabel}-${grade}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
